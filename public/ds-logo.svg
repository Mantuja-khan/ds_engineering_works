<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#gradient1)" stroke="url(#gradient2)" stroke-width="2"/>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#075985;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- DS Text -->
  <text x="50" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="url(#textGradient)">DS</text>
  
  <!-- Engineering Text -->
  <text x="50" y="58" font-family="Arial, sans-serif" font-size="8" font-weight="normal" text-anchor="middle" fill="url(#textGradient)">ENGINEERING</text>
  
  <!-- Decorative Elements -->
  <circle cx="25" cy="25" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="75" cy="75" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="80" cy="30" r="2.5" fill="#ffffff" opacity="0.2"/>
  
  <!-- Industrial Symbol -->
  <rect x="35" y="65" width="30" height="2" fill="url(#textGradient)" opacity="0.8"/>
  <rect x="40" y="68" width="20" height="1.5" fill="url(#textGradient)" opacity="0.6"/>
</svg>